<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F2EADB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BT Deliveries">
<!-- Only this site's own script files may run, and the page may only talk to the order database. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' blob: data:; media-src blob:; connect-src https://vfphzezqnegvitnvqpes.supabase.co; base-uri 'none'; form-action 'none'">
<title>Deliveries · Blooming Treasure</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{--ivory:#FBF7EF;--cream:#F2EADB;--ink:#22312A;--green:#2F5D45;--leaf:#7FA68C;--peony:#C9617F;--blush:#F4DCE2;
  --mute:#6F7A6E;--line:#E4DBCB;--white:#fff;--warn:#8A4B1E;--warn-bg:#FBEBDD;
  --display:"Fraunces",Georgia,serif;--body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
main{max-width:520px;margin:0 auto;padding:16px 14px max(40px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--display);font-weight:500;font-size:1.5rem;margin:6px 4px 0;color:var(--green)}
h2{margin:8px 4px 0;font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.tk{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.tk.done{opacity:.75}
.top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.top b{font-size:1.08rem}
.pill{border-radius:999px;padding:2px 10px;font-size:.75rem;font-weight:600;background:#DDEADF;color:var(--green);white-space:nowrap}
.pill.now{background:var(--blush);color:#8E3350}.pill.w{background:var(--warn-bg);color:var(--warn)}
.sub{color:var(--mute);font-size:.9rem;margin:0}
.addr{font-size:1.02rem;margin:0}
.say{background:var(--ivory);border-left:3px solid var(--leaf);border-radius:6px;padding:8px 11px;margin:0;white-space:pre-wrap;font-size:.95rem}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1 1 140px;display:flex;align-items:center;justify-content:center;gap:6px;text-align:center;border-radius:999px;padding:13px 10px;font:inherit;font-weight:600;text-decoration:none;cursor:pointer;
  background:var(--white);color:var(--green);border:1px solid var(--green)}
.btn.p{background:var(--green);color:var(--white)}
.btn.d{color:var(--warn);border-color:#C98562}
.btn:disabled{opacity:.5;cursor:wait}
:focus-visible{outline:3px solid var(--peony);outline-offset:2px}
.share{display:flex;align-items:center;gap:10px;background:#EEF4EE;border-radius:12px;padding:9px 12px;font-size:.86rem;color:var(--green)}
.share.off{background:var(--warn-bg);color:var(--warn)}
.share::before{content:"";flex:none;width:9px;height:9px;border-radius:50%;background:#2FA36B}
.share.off::before{background:#C98562}
.share span{flex:1}
.share button{font:inherit;font-weight:600;background:none;border:0;padding:4px 0;color:inherit;text-decoration:underline;cursor:pointer}
.up{font-size:.86rem;color:var(--mute);display:flex;flex-direction:column;gap:5px}
.bar2{height:6px;border-radius:3px;background:var(--line);overflow:hidden}.bar2 i{display:block;height:100%;background:var(--green)}
.empty,.center{color:var(--mute);text-align:center;padding:18px}
.center{padding:60px 24px}
.ic{flex:none}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--white);border-radius:999px;padding:9px 18px;font-size:.9rem;max-width:90vw;z-index:9}
#toast.bad{background:#A3352B}
</style>
</head>
<body>
<main id="app"><div class="center">Loading your deliveries…</div></main>
<input type="file" id="cam" accept="image/*,video/*" capture="environment" hidden>
<input type="file" id="lib" accept="image/*,video/*" multiple hidden>
<script src="lib.js"></script>
<script src="driver.js"></script>
</body>
</html>
