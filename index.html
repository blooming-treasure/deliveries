<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F2EADB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BT Deliveries">
<title>Deliveries · Blooming Treasure</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{--ivory:#FBF7EF;--cream:#F2EADB;--ink:#22312A;--green:#2F5D45;--leaf:#7FA68C;--peony:#C9617F;--blush:#F4DCE2;
  --mute:#6F7A6E;--line:#E4DBCB;--white:#fff;--warn:#8A4B1E;--warn-bg:#FBEBDD;
  --display:"Fraunces",Georgia,serif;--body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
main{max-width:520px;margin:0 auto;padding:16px 14px max(40px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--display);font-weight:500;font-size:1.5rem;margin:6px 4px 0;color:var(--green)}
h2{margin:8px 4px 0;font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.tk{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.tk.done{opacity:.65}
.top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.top b{font-size:1.08rem}
.pill{border-radius:999px;padding:2px 10px;font-size:.75rem;font-weight:600;background:#DDEADF;color:var(--green);white-space:nowrap}
.pill.now{background:var(--blush);color:#8E3350}.pill.w{background:var(--warn-bg);color:var(--warn)}
.sub{color:var(--mute);font-size:.9rem;margin:0}
.addr{font-size:1.02rem;margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1 1 140px;text-align:center;border-radius:999px;padding:13px 10px;font:inherit;font-weight:600;text-decoration:none;cursor:pointer;
  background:var(--white);color:var(--green);border:1px solid var(--green)}
.btn.p{background:var(--green);color:var(--white)}
.btn.d{color:var(--warn);border-color:#C98562}
.btn:disabled{opacity:.5;cursor:wait}
.btn:focus-visible{outline:3px solid var(--peony);outline-offset:2px}
.share{display:flex;align-items:center;gap:10px;background:#EEF4EE;border-radius:12px;padding:9px 12px;font-size:.86rem;color:var(--green)}
.share.off{background:var(--warn-bg);color:var(--warn)}
.share::before{content:"";flex:none;width:9px;height:9px;border-radius:50%;background:#2FA36B}
.share.off::before{background:#C98562}
.share span{flex:1}
.share button{font:inherit;font-weight:600;background:none;border:0;padding:4px 0;color:inherit;text-decoration:underline;cursor:pointer}
.empty,.center{color:var(--mute);text-align:center;padding:18px}
.center{padding:60px 24px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--white);border-radius:999px;padding:9px 18px;font-size:.9rem;max-width:90vw}
</style>
</head>
<body>
<main id="app"><div class="center">Loading your deliveries…</div></main>
<div id="toast" hidden role="status"></div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<script>
const LOOP_URL = "https://vfphzezqnegvitnvqpes.supabase.co";
const LOOP_KEY = "sb_publishable_ibhRhkM12PhBXl18dYrObQ_ZcFZ-NtB";
const STORE = "loop_driver_key", POLL_MS = 30000;

const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) { if (v == null || v === false) continue; if (k === "class") n.className = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v === true ? "" : v); }
  for (const k of kids.flat()) if (k != null && k !== false) n.append(k.nodeType ? k : document.createTextNode(String(k)));
  return n;
};
let key = location.hash.slice(1).trim();
// The key stays in the address on purpose: a bookmark or home-screen icon then still opens this driver's own page
// (phones can wipe a page's saved data, and an iPhone home-screen icon has separate storage).
try { if (key) localStorage.setItem(STORE, key); else key = localStorage.getItem(STORE) || ""; } catch (e) {}

async function rpc(fn, body) {
  const r = await fetch(`${LOOP_URL}/rest/v1/rpc/${fn}`, { method: "POST",
    headers: { apikey: LOOP_KEY, Authorization: "Bearer " + LOOP_KEY, "Content-Type": "application/json" }, body: JSON.stringify({ p_key: key, ...body }) });
  if (!r.ok) { const e = await r.json().catch(() => ({})); throw Object.assign(new Error(e.message || "HTTP " + r.status), { code: e.code }); }
  return r.json();
}
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 3500); }
const nonce = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
function shrink(file) {
  return new Promise((ok, bad) => {
    const img = new Image();
    img.onload = () => { const s = Math.min(1, 1400 / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src); ok(c.toDataURL("image/jpeg", 0.8).split(",")[1]); };
    img.onerror = () => bad(new Error("That file is not a photo"));
    img.src = URL.createObjectURL(file);
  });
}

let data = null, busy = false, askProblem = null;
async function act(o, action, arg = {}) {
  if (busy) return; busy = true; render();
  try { await rpc("driver_action", { p_order: o.id, p_action: action, p_arg: { nonce: nonce(), ...arg } }); askProblem = null; await load(); toast("Saved: " + o.order); }
  catch (e) { toast("Not saved: " + e.message); }
  finally { busy = false; render(); }
}
function deliveredWithPhoto(o) {
  const cam = document.getElementById("cam");
  cam.onchange = async () => { const f = cam.files[0]; cam.value = ""; if (!f) return;
    try { toast("Sending photo…"); await act(o, "delivered", { data: await shrink(f), mime: "image/jpeg" }); } catch (e) { toast(e.message); } };
  cam.click();
}

// ---- Location sharing: only while one of MY deliveries is on its way, only while this page is open on screen.
// The customer's tracking page shows the position with the time it was last seen; the database wipes it at Delivered.
const SHARE = "loop_driver_share";
let geoWatch = null, geo = "idle", lastSent = 0, wake = null, shareOff = false;
try { shareOff = localStorage.getItem(SHARE) === "off"; } catch (e) {}
const outNow = () => data ? data.mine.filter(o => o.status === "out" && o.problem !== "failed") : [];
function onPos(p) {
  const was = geo; geo = "on";
  if (was !== "on") render();
  if (p.coords.accuracy > 500 || Date.now() - lastSent < 20000) return;
  lastSent = Date.now();
  for (const o of outNow())
    rpc("driver_action", { p_order: o.id, p_action: "position", p_arg: { lat: p.coords.latitude, lng: p.coords.longitude } }).catch(() => {});
}
function onPosErr(e) { geo = e.code === 1 ? "denied" : "weak"; render(); }
async function syncGeo() {
  const want = outNow().length > 0 && !shareOff && "geolocation" in navigator && document.visibilityState === "visible";
  if (want && geoWatch == null) {
    geo = "asking";
    geoWatch = navigator.geolocation.watchPosition(onPos, onPosErr, { enableHighAccuracy: true, maximumAge: 10000, timeout: 30000 });
    try { if (navigator.wakeLock) wake = await navigator.wakeLock.request("screen"); } catch (e) {}   // keep the screen on while sharing
  } else if (!want && geoWatch != null) {
    navigator.geolocation.clearWatch(geoWatch); geoWatch = null; lastSent = 0; geo = "idle";
    try { if (wake) wake.release(); } catch (e) {} wake = null;
  }
}
function setShare(on) { shareOff = !on; try { localStorage.setItem(SHARE, on ? "on" : "off"); } catch (e) {} syncGeo(); render(); }
function shareLine() {
  if (!("geolocation" in navigator)) return null;
  const link = (label, fn) => el("button", { type: "button", onclick: fn }, label);
  if (shareOff) return el("div", { class: "share off" }, el("span", {}, "Location sharing is off. The customer sees \"on its way\" with no map."), link("Turn on", () => setShare(true)));
  if (geo === "denied") return el("div", { class: "share off" }, el("span", {}, "This phone is blocking location for this page. Allow it in the browser's site settings to show the customer a map."));
  if (geo === "weak") return el("div", { class: "share off" }, el("span", {}, "Can't get a location fix right now. Still trying."), link("Stop", () => setShare(false)));
  return el("div", { class: "share" }, el("span", {}, geo === "on" ? "The customer can see where you are while this page is open." : "Getting your location…"), link("Stop sharing", () => setShare(false)));
}

const stage = o => o.status === "ready" ? "Ready to load" : o.status === "preparing" ? "Being made" : "Not started yet";
function mine(o) {
  const r = o.recipient, B = (label, fn, cls) => el("button", { class: "btn " + (cls || ""), disabled: busy, onclick: fn }, label);
  const full = r ? [r.address, r.city, r.state, r.zip].filter(Boolean).join(", ") : "";
  const done = o.status === "delivered", out = o.status === "out", failed = o.problem === "failed";
  return el("div", { class: "tk" + (done ? " done" : "") },
    el("div", { class: "top" }, el("b", {}, o.arrangement || "Order"),
      el("span", { class: "pill" + (failed ? " w" : out ? " now" : "") }, done ? "Delivered" : failed ? "Not delivered" : out ? "On your way" : stage(o))),
    el("p", { class: "sub" }, [o.order, o.due_window, o.tone === "quiet" && "Sympathy"].filter(Boolean).join(" · ")),
    !done && r && el("p", { class: "addr" }, el("b", {}, r.name || o.for || ""), el("br"), full),
    !done && !r && el("p", { class: "sub" }, "For " + (o.for || "the recipient") + ". The address is on the ticket."),
    !done && r && el("div", { class: "row" },
      el("a", { class: "btn", href: "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(full), target: "_blank", rel: "noopener" }, "Navigate"),
      r.phone && el("a", { class: "btn", href: "tel:" + r.phone }, "Call recipient")),
    !done && !out && el("div", { class: "row" }, B("Start delivery", () => act(o, "start"), "p")),
    out && !failed && shareLine(),
    out && askProblem !== o.id && el("div", { class: "row" }, B("Delivered + photo", () => deliveredWithPhoto(o), "p"), B("Delivered, no photo", () => act(o, "delivered")), B("Problem", () => { askProblem = o.id; render(); }, "d")),
    out && askProblem === o.id && el("div", { class: "row" },
      ["Nobody home", "Wrong address", "Refused", "Other"].map(x => B(x, () => act(o, "problem", { reason: x }), "d")), B("Back", () => { askProblem = null; render(); })));
}
function open(o) {
  return el("div", { class: "tk" },
    el("div", { class: "top" }, el("b", {}, o.arrangement || "Order"), el("span", { class: "pill" }, stage(o))),
    el("p", { class: "sub" }, [o.order, o.for && "For " + o.for, o.due_window].filter(Boolean).join(" · ")),
    el("div", { class: "row" }, el("button", { class: "btn", disabled: busy, onclick: () => act(o, "claim") }, "Take this delivery")));
}

function render() {
  const app = document.getElementById("app");
  if (!key) return app.replaceChildren(el("div", { class: "center" }, "Open this page from your personal driver link."));
  if (!data) return;
  app.replaceChildren(
    el("h1", {}, "Hi " + data.me.name.split(" ")[0]),
    el("h2", {}, "Your deliveries"),
    ...(data.mine.length ? data.mine.map(mine) : [el("div", { class: "empty" }, "Nothing assigned to you right now.")]),
    el("h2", {}, "Waiting for a driver today"),
    ...(data.open.length ? data.open.map(open) : [el("div", { class: "empty" }, "No deliveries waiting.")]));
  syncGeo();
}
async function load() {
  try { data = await rpc("driver_view", {}); }
  catch (e) {
    if (e.code === "42501") { key = ""; try { localStorage.removeItem(STORE); } catch (x) {} document.getElementById("app").replaceChildren(el("div", { class: "center" }, "This link is no longer active. Ask the shop for a new one.")); return; }
    if (!data) document.getElementById("app").replaceChildren(el("div", { class: "center" }, "Can't reach the order system. Retrying…"));
  }
}
const refresh = async () => { if (!busy && askProblem == null) { await load(); render(); } };
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refresh(); else syncGeo(); });   // back from the maps app
(async function start() { render(); if (!key) return; await load(); render(); setInterval(refresh, POLL_MS); })();
</script>
</body>
</html>
